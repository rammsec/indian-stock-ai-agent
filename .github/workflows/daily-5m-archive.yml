name: Daily 5m NSE Candle Archive

on:
  schedule:
    # Run at 15:50 IST (10:20 UTC) Monday-Friday after NSE market close
    - cron: "20 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-5m:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pandas numpy pyarrow yfinance

      - name: Archive latest 5m NSE candles
        run: |
          python scripts/archive_daily_5m.py

      - name: Commit updated Parquet archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday/ data/lab/daily_archive_health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): archive daily 5m NSE candles [skip ci]"
            git push
          else
            echo "No new 5m candles to commit."
          fi

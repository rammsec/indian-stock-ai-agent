name: Intraday & Historical AI Trading Lab Tests

on:
  push:
    branches: [main, feature/personal-ai-trading-desk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-intraday-and-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pydantic pandas numpy pyarrow yfinance

      - name: Run Intraday & Historical Lab Test Suite
        run: |
          pytest tests/intraday/ tests/phase6/ -v --tb=short

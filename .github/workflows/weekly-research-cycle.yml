name: Weekly Automated Research & Qualification Cycle

on:
  schedule:
    # Run every Sunday at 17:30 IST (12:00 UTC)
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic pandas numpy pyarrow yfinance

      - name: Run Weekly Research & Qualification Cycle (CYCLE-002)
        run: |
          python scripts/run_weekly_research.py

      - name: Upload Research Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-reports
          path: |
            data/lab/cycle_002_report.json
            data/lab/provenance_report.json
            data/lab/weekly_research_status.json
            data/lab/sealed_holdout_registry.json
            docs/lab/data/lab_index.json

      - name: Commit updated research reports if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab/ docs/lab/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(research): weekly automated CYCLE-002 research update [skip ci]"
            git push
          else
            echo "No research report changes to commit."
          fi

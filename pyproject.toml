[project]
name = "indian-stock-ai-agent"
version = "3.1.0"
description = "BharatAlpha AI — Quantitative Intelligence Platform for Indian Equities (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "yfinance>=0.2.50",
    "duckdb>=1.0.0",
    "pyarrow>=16.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: Weekly Automated Research & Qualification Cycle

on:
  schedule:
    # Run every Sunday at 17:30 IST (12:00 UTC)
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pydantic pandas numpy pyarrow yfinance

      - name: Run Weekly Phase 11.3 Readiness & Integrity Audit (Read-Only)
        run: |
          python scripts/run_weekly_research.py

      - name: Upload Weekly Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-audit
          path: |
            data/lab/weekly_research_status.json
            data/lab/history/

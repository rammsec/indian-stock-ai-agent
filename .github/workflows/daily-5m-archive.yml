name: Daily 5m NSE Candle Archive

on:
  schedule:
    # Run at 15:50 IST (10:20 UTC) Monday-Friday after NSE market close
    - cron: "20 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-5m-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-5m:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pandas numpy pyarrow yfinance

      - name: Archive latest 5m NSE candles
        run: |
          python scripts/archive_daily_5m.py

      - name: Upload 5m Archive Artifacts (No Direct Push to Main)
        uses: actions/upload-artifact@v4
        with:
          name: daily-5m-archive
          path: |
            data/intraday/
            data/lab/daily_archive_health.json

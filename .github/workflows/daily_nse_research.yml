name: Daily NSE Quantitative Data Foundation & Research Pipeline

on:
  schedule:
    # Runs Monday-Friday at 13:00 UTC (6:30 PM IST — after NSE Bhavcopy & Delivery reports are published)
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      extra_symbols:
        description: "Optional comma-separated NSE symbols to add/refresh (e.g. ZOMATO,IRCTC,RVNL,SUZLON)"
        required: false
        default: ""
      force_holiday_run:
        description: "Set to 'true' to run even on an NSE trading holiday"
        required: false
        default: "false"

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  ENABLE_GEMINI_EXTRACTOR: "false"
  ENABLE_BIGQUERY: "false"

jobs:
  nse-quant-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check NSE Trading Holiday Calendar (Asia/Kolkata)
        id: calendar_check
        run: |
          python -c "
          import os
          from backend.config import is_nse_trading_day
          force = os.environ.get('FORCE_HOLIDAY_RUN', 'false').lower() == 'true'
          is_open = is_nse_trading_day()
          print(f'NSE Trading Day: {is_open} | Force Run: {force}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'should_run={str(is_open or force).lower()}\n')
          "
        env:
          FORCE_HOLIDAY_RUN: ${{ github.event.inputs.force_holiday_run }}

      - name: Phase 1 — Collect NSE Bhavcopy, Delivery %, Indices, Market Regime & Parquet/DuckDB Store
        if: steps.calendar_check.outputs.should_run == 'true'
        run: |
          python scripts/run_phase1_foundation.py

      - name: Generate Validated Frontend JSONs & Run Phases 2-5 Quant, Corporate & News Pipelines
        if: steps.calendar_check.outputs.should_run == 'true'
        env:
          EXTRA_SYMBOLS: ${{ github.event.inputs.extra_symbols }}
        run: |
          python scripts/generate_static_data.py
          python scripts/run_phase2_features.py
          python scripts/run_phase3_backtest.py
          python scripts/run_phase4_corporate_intel.py
          python -c "from backend.news_intel.pipeline import run_phase5_intelligence_pipeline; run_phase5_intelligence_pipeline(use_network=True, persist=True)"
          cp data/predictions/phase5_intelligence.json docs/data/phase5_intelligence.json
          python scripts/build_github_pages.py

      - name: Run Automated Test Suite
        if: steps.calendar_check.outputs.should_run == 'true'
        run: |
          pytest -v

      - name: Commit & Push Updated Parquet Store & GitHub Pages Data
        if: steps.calendar_check.outputs.should_run == 'true'
        run: |
          git config user.name "BharatAlpha Quant Bot"
          git config user.email "actions@github.com"
          git add data/processed/ data/features/ data/predictions/ data/backtests/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(quant): update daily NSE Parquet store, ML predictions, bulk deals & GitHub Pages [skip ci]"
            git push origin main
          fi
